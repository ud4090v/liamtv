name: Node test suite

on:
  push:
    paths:
      - 'api/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'manage.html'
      - 'playlist-manager.html'
      - 'tv-player.html'
      - '.github/workflows/test-node-suite.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'manage.html'
      - 'playlist-manager.html'
      - 'tv-player.html'
      - '.github/workflows/test-node-suite.yml'
  workflow_dispatch:

jobs:
  test-node-suite:
    name: npm test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CHROME_PATH: /usr/bin/google-chrome

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Report Chrome version
        run: /usr/bin/google-chrome --version

      - name: Run node test suite
        run: |
          set -o pipefail
          node --test --test-reporter=tap tests/**/*.test.mjs | tee /tmp/node-test.tap

      - name: Assert the suite actually ran the LIA-37 regression tests
        run: |
          set -euo pipefail
          TAP=/tmp/node-test.tap
          EXPECTED='tests/liamtv-a11y-driver-honours-target.test.mjs'
          if ! grep -qF "$EXPECTED" "$TAP"; then
            echo "::error::Expected the node test run to execute $EXPECTED"
            echo '--- TAP output ---'
            cat "$TAP"
            exit 1
          fi
          COUNT=$(grep -cE '(^|[[:space:]])ok [0-9]+ - ' "$TAP" || true)
          if [ "$COUNT" -le 0 ]; then
            echo "::error::Expected a non-zero test count, got $COUNT"
            echo '--- TAP output ---'
            cat "$TAP"
            exit 1
          fi
          echo "Executed $COUNT test(s), including $EXPECTED"
