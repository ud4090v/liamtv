name: Runtime accessibility check (LIA-32)

on:
  push:
    paths:
      - 'api/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'manage.html'
      - 'playlist-manager.html'
      - 'tv-player.html'
      - '.github/workflows/test-a11y.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'tests/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'manage.html'
      - 'playlist-manager.html'
      - 'tv-player.html'
      - '.github/workflows/test-a11y.yml'
  workflow_dispatch:

jobs:
  test-a11y:
    name: npm run test:a11y
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Report Chrome version
        run: /usr/bin/google-chrome --version

      - name: Run runtime accessibility checks
        run: npm run test:a11y
        env:
          CHROME_PATH: /usr/bin/google-chrome
